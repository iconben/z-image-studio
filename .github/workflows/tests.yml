name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI never downloads model weights. Any accidental fetch fails loudly instead of
  # silently pulling gigabytes of weights onto a runner that may not have the disk,
  # RAM or time budget for them.
  HF_HUB_OFFLINE: "1"
  # PyPI's default Linux `torch` wheel is CUDA-flavoured and drags in ~2.6 GB of
  # nvidia-* packages that a CPU-only runner cannot use. `UV_TORCH_BACKEND=cpu`
  # resolves the CPU build instead; the exact version still comes from uv.lock.
  UV_TORCH_BACKEND: cpu

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # Pinned to the uv that produced uv.lock: `--locked` below fails when
          # any other resolver picks different versions, so a uv release would
          # otherwise look like lock drift. Bump this and re-run `uv lock`
          # together.
          version: "0.12.17"
          # Part of the cache key; without it both matrix jobs compute the same
          # key and one of them loses the save race on every run.
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Versions come from uv.lock (exported as constraints) so CI runs the
        # dependency set the lock describes -- only the torch build differs.
        # `--locked` makes the export fail when pyproject.toml and uv.lock
        # disagree, so a dependency added or bumped without re-locking is caught
        # here rather than resolved from PyPI unpinned.
        # Note: do NOT run pytest through `uv run`, which would re-sync the project
        # and pull the CUDA torch wheel back in.
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv export --locked --no-hashes --no-emit-project --group dev \
            -o "$RUNNER_TEMP/constraints.txt"
          uv pip install -c "$RUNNER_TEMP/constraints.txt" -e . --group dev

      - name: Assert the CPU torch build was installed
        # The reason for UV_TORCH_BACKEND=cpu is that PyPI's Linux torch wheel
        # drags in ~2.6 GB of nvidia-* packages a CPU runner cannot use. If that
        # variable were dropped or renamed, uv would install the CUDA build and
        # the suite would still pass -- just slowly and fat. Fail loudly instead.
        #
        # The listing is a command of its own rather than part of the `if`
        # pipeline. A pipeline reports grep's status, so a `uv pip list` that
        # failed -- missing .venv, renamed flag, bad interpreter path -- would
        # read as "no CUDA packages found" and pass the step silently, which is
        # the exact failure this step exists to catch. Standalone, `bash -e`
        # aborts the step instead.
        run: |
          uv pip list --python .venv/bin/python > "$RUNNER_TEMP/installed.txt"
          if grep -qiE "^(nvidia|cuda)-" "$RUNNER_TEMP/installed.txt"; then
            echo "::error::CUDA packages were installed; UV_TORCH_BACKEND=cpu did not take effect"
            exit 1
          fi

      - name: Run unit tests
        run: |
          .venv/bin/python -m pytest -m "not integration and not requires_model" --durations=10

      - name: Run integration tests
        # `and not requires_model` keeps the model tier out of CI even if a test
        # carries both markers, which is how the two skipped GPU tests in
        # tests/test_mcp_integration.py are tagged.
        run: |
          .venv/bin/python -m pytest -m "integration and not requires_model" --durations=10
